name: RTL8723BE portable C regressions

on:
  push:
    paths:
      - 'src/rtwn8723be_linux_state.*'
      - 'src/rtwn8723be_rx_decode.*'
      - 'src/rtwn8723be_tx_desc.*'
      - 'src/rtwn8723be_netbsd.c'
      - 'src/rtwn8723be_runtime_owner.c'
      - 'src/rtwn8723be_runtime_owner.h'
      - 'src/rtwn8723be_f16_1.h'
      - 'src/rtwn8723be_pwrseq_data.h'
      - 'src/rtwn8723be_netbsd.h'
      - 'src/rtwn8723be_os_compat.h'
      - 'src/rtwn8723be_rf_native.c'
      - 'src/rtwn8723be_rf_native.h'
      - 'src/rtwn8723be_rf_channel_state.c'
      - 'src/rtwn8723be_rf_channel_state.h'
      - 'src/rtwn8723be_h2c.c'
      - 'src/rtwn8723be_h2c.h'
      - 'src/rtwn8723be_h2c_native.c'
      - 'src/rtwn8723be_h2c_native.h'
      - 'config/files.rtwn8723be_native'
      - 'src/rtwn8723be_f16_1_dma.c'
      - 'src/rtwn8723be_rx_native.c'
      - 'src/**'
      - 'tests/test_port_closure_inventory.py'
      - 'tests/test_linux_lifecycle_stop.py'
      - 'tests/test_mark_hal_start_stage.py'
      - 'tests/test_phy_identity_native.py'
      - 'tests/test_rx_decode.py'
      - 'tests/test_tx_desc.py'
      - 'tests/test_efuse_shadow_bounds.py'
      - 'tests/test_dma_mem_unwind.py'
      - 'tests/test_rf_native_adapter.py'
      - 'tests/test_rf_channel_state.py'
      - 'tests/test_h2c_mailbox.py'
      - 'tests/test_h2c_native_binding.py'
      - 'tests/test_kernel_source_integrity.py'
      - 'tests/test_runtime_owner.py'
      - 'tests/test_rx_dma_bounds.py'
      - 'tests/**'
      - '.github/workflows/portable-c-regressions.yml'
  pull_request:
    paths:
      - 'src/rtwn8723be_linux_state.*'
      - 'src/rtwn8723be_rx_decode.*'
      - 'src/rtwn8723be_tx_desc.*'
      - 'src/rtwn8723be_netbsd.c'
      - 'src/rtwn8723be_runtime_owner.c'
      - 'src/rtwn8723be_runtime_owner.h'
      - 'src/rtwn8723be_f16_1.h'
      - 'src/rtwn8723be_pwrseq_data.h'
      - 'src/rtwn8723be_netbsd.h'
      - 'src/rtwn8723be_os_compat.h'
      - 'src/rtwn8723be_rf_native.c'
      - 'src/rtwn8723be_rf_native.h'
      - 'src/rtwn8723be_rf_channel_state.c'
      - 'src/rtwn8723be_rf_channel_state.h'
      - 'src/rtwn8723be_h2c.c'
      - 'src/rtwn8723be_h2c.h'
      - 'src/rtwn8723be_h2c_native.c'
      - 'src/rtwn8723be_h2c_native.h'
      - 'config/files.rtwn8723be_native'
      - 'src/rtwn8723be_f16_1_dma.c'
      - 'src/rtwn8723be_rx_native.c'
      - 'src/**'
      - 'tests/test_port_closure_inventory.py'
      - 'tests/test_linux_lifecycle_stop.py'
      - 'tests/test_mark_hal_start_stage.py'
      - 'tests/test_phy_identity_native.py'
      - 'tests/test_rx_decode.py'
      - 'tests/test_tx_desc.py'
      - 'tests/test_efuse_shadow_bounds.py'
      - 'tests/test_dma_mem_unwind.py'
      - 'tests/test_rf_native_adapter.py'
      - 'tests/test_rf_channel_state.py'
      - 'tests/test_h2c_mailbox.py'
      - 'tests/test_h2c_native_binding.py'
      - 'tests/test_kernel_source_integrity.py'
      - 'tests/test_runtime_owner.py'
      - 'tests/test_rx_dma_bounds.py'
      - 'tests/**'
      - '.github/workflows/portable-c-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-c11:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Available compiler and Python
        run: |
          cc --version | head -n 1
          python3 --version
      - name: Linux-order lifecycle preflight and failure states
        run: python3 tests/test_linux_lifecycle_stop.py
      - name: HAL-start phase contract (strict C11 / UBSan)
        run: python3 tests/test_mark_hal_start_stage.py
      - name: Native PHY identity, RF paths and XTAL (strict C11 / UBSan)
        run: python3 tests/test_phy_identity_native.py
      - name: RX/C2H descriptor decoder
        run: python3 tests/test_rx_decode.py
      - name: TX descriptor encoder
        run: python3 tests/test_tx_desc.py
      - name: EFUSE shadow section bounds (strict C11 / UBSan)
        run: python3 tests/test_efuse_shadow_bounds.py
      - name: Native source/header and tool-output integrity
        run: python3 tests/test_kernel_source_integrity.py
      - name: Conservative world-regdomain baseline (strict C11)
        run: python3 tests/test_regdomain_world_baseline.py
      - name: World-regdomain NetBSD glue
        run: python3 tests/test_regdomain_world_glue.py
      - name: Net80211 registration publication order
        run: python3 tests/test_net80211_unpublished_registration.py
      - name: Net80211 unstarted probe rollback (strict C11)
        run: python3 tests/test_net80211_unstarted_rollback.py
      - name: Reject false-success adapter start and unsafe retry (C11 / UBSan)
        run: |
          python3 tests/test_net80211_prestart_quarantine.py
          python3 tests/test_rfkill_net80211_start.py
      - name: Reject net80211 RX and TX after runtime stop (C11 / UBSan)
        run: python3 tests/test_net80211_late_rx_stop.py
      - name: Retain hardware stop owner on net80211 failure (C11 / UBSan)
        run: python3 tests/test_net80211_stop_failure_owner.py
      - name: Reject net80211 detach after false-success hardware STOP (C11 / UBSan)
        run: python3 tests/test_net80211_false_stop_unregister.py
      - name: Retry deferred STOP on explicit net80211 DOWN ioctl (C11 / UBSan)
        run: python3 tests/test_net80211_deferred_down_retry.py
      - name: Inert runtime-owner lifecycle foundation
        run: python3 tests/test_runtime_owner.py
      - name: Pure BTC context preparation (strict C11 / UBSan)
        run: python3 tests/test_btc_context.py
      - name: Fail-closed native PCI probe admission (C11 / UBSan)
        run: python3 tests/test_native_probe_admission.py
      - name: Reverse unstarted probe resource owners (C11 / UBSan)
        run: python3 tests/test_post_registration_probe_unwind.py
      - name: Verify unique datapath/TX/IRQ owner release
        run: python3 tests/test_datapath_owner_lifetime.py
      - name: Execute native datapath TX stop gate and RX softc header preflight
        run: python3 tests/test_datapath_tx_stage_and_native_include.py
      - name: Recheck TX startup and quarantine completion under IPL_NET (C11 / UBSan)
        run: python3 tests/test_datapath_tx_completion_quiescence.py
      - name: Reject datapath unprepare while external TX completion is running (C11 / UBSan)
        run: python3 tests/test_datapath_tx_completion_lease.py
      - name: Refuse RX DMA drain overlap with hardware STOP or datapath unprepare (C11 / UBSan)
        run: python3 tests/test_datapath_rx_inflight_stop.py
      - name: Atomically enter STOPPING under native TX lock (C11 / UBSan)
        run: python3 tests/test_native_stopping_tx_atomic.py
      - name: Verify RX/C2H owner release and staged Bluetooth admission
        run: python3 tests/test_rx_binding_owner_lifetime.py
      - name: Serialize and drain pending hard/soft IRQ work (C11 / UBSan)
        run: python3 tests/test_irq_pending_quiescence.py
      - name: Gate Bluetooth MP C2H under native IPL_SOFTNET lock (C11 / UBSan)
        run: python3 tests/test_bt_mp_rx_gate.py
      - name: Check real RFKill worker and net80211 start admission (C11 / UBSan)
        run: python3 tests/test_rfkill_net80211_start.py
      - name: Publish IFF_RUNNING only with native TX owner and safe RFKill rollback (C11 / UBSan)
        run: python3 tests/test_net80211_native_running_publication.py
      - name: Invalidate DMA32 authority on native PCI rollback
        run: python3 tests/test_native_dma_release_invariant.py
      - name: Native callback and manifest inventory
        run: python3 tests/test_port_closure_inventory.py
      - name: Native RF bus_space init adapter (strict C11 / UBSan)
        run: python3 tests/test_rf_native_adapter.py
      - name: RF channel state Linux-order and failure atomicity (strict C11 / UBSan)
        run: python3 tests/test_rf_channel_state.py
      - name: H2C PCIe mailbox ordering and failures (strict C11 / UBSan)
        run: python3 tests/test_h2c_mailbox.py
      - name: Native H2C NetBSD adapter (strict C11 / UBSan)
        run: python3 tests/test_h2c_native_binding.py
      - name: Descriptor DMA allocation unwind (strict C11 / UBSan)
        run: python3 tests/test_dma_mem_unwind.py
      - name: RX DMA descriptor and buffer bounds (strict C11 / UBSan)
        run: python3 tests/test_rx_dma_bounds.py
